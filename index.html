<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EU Global Çevre | Entegre Çevre & Atık Yönetimi Çözümleri</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --accent: #3b82f6;
            --bg-dark: #091313;
            --card-bg: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.5;
        }

        /* Fixed Navigation */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: rgba(9, 19, 19, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.5px;
        }

        .logo i {
            color: var(--primary);
            font-size: 1.7rem;
        }

        nav ul {
            display: flex;
            gap: 30px;
            list-style: none;
            align-items: center;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 0;
        }

        nav a:hover, nav a.active {
            color: var(--primary);
        }

        .header-contact {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-phone {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--primary);
            padding: 8px 16px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .header-phone:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }

        /* Side Pagination Dots */
        .side-dots {
            position: fixed;
            right: 25px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 100;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .dot.active {
            background: var(--primary);
            box-shadow: 0 0 12px var(--primary);
            transform: scale(1.3);
        }

        /* Main Container & Sections */
        section {
            min-height: 100vh;
            width: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 110px 8% 60px;
        }

        /* Background Overlays */
        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background-size: cover;
            background-position: center;
            filter: brightness(0.22);
        }

        .hero-bg { background-image: url('https://images.pexels.com/photos/802221/pexels-photo-802221.jpeg?auto=compress&cs=tinysrgb&w=1920'); }
        .about-bg { background-image: url('https://images.pexels.com/photos/957024/forest-trees-perspective-bright-957024.jpeg?auto=compress&cs=tinysrgb&w=1920'); }
        .services-bg { background-image: url('https://images.pexels.com/photos/1549528/pexels-photo-1549528.jpeg?auto=compress&cs=tinysrgb&w=1920'); }
        .contact-bg { background-image: url('https://images.pexels.com/photos/3735218/pexels-photo-3735218.jpeg?auto=compress&cs=tinysrgb&w=1920'); }

        /* Section Contents */
        .content {
            position: relative;
            z-index: 2;
            max-width: 1200px;
            width: 100%;
        }

        /* Hero Content */
        .hero-content {
            text-align: center;
            max-width: 850px;
            margin: 0 auto;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--primary);
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
            backdrop-filter: blur(5px);
        }

        .hero-content h1 {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 20px;
            letter-spacing: -1px;
            color: #ffffff;
        }

        .hero-content p {
            font-size: 1.15rem;
            color: var(--text-muted);
            margin-bottom: 30px;
            line-height: 1.6;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 32px;
            border-radius: 40px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
        }

        .btn-primary {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        }

        .btn-primary:hover {
            background: #10b981;
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.5);
        }

        .btn-outline {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        /* Section Titles */
        .section-header {
            margin-bottom: 30px;
            text-align: center;
        }

        .subtitle {
            color: var(--primary);
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: block;
            margin-bottom: 6px;
        }

        .title {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #fff;
        }

        /* About Grid */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
        }

        .about-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(12px);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            padding: 16px 10px;
            border-radius: 14px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 1.8rem;
            color: var(--primary);
            font-weight: 800;
        }

        .stat-card p {
            color: var(--text-muted);
            font-size: 0.78rem;
            margin-top: 4px;
            font-weight: 600;
        }

        /* Services Grid (8 Hizmet Kartı) */
        .services-grid-8 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .service-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 22px 18px;
            border-radius: 18px;
            backdrop-filter: blur(12px);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .service-card:hover {
            transform: translateY(-4px);
            border-color: rgba(16, 185, 129, 0.4);
            background: rgba(255, 255, 255, 0.07);
        }

        .card-num {
            position: absolute;
            bottom: 8px;
            right: 12px;
            font-size: 2rem;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.04);
            pointer-events: none;
        }

        .service-icon {
            width: 44px;
            height: 44px;
            background: rgba(16, 185, 129, 0.12);
            color: var(--primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            margin-bottom: 14px;
        }

        .service-card h3 {
            font-size: 0.98rem;
            margin-bottom: 8px;
            font-weight: 700;
            color: #fff;
        }

        .service-card p {
            color: var(--text-muted);
            font-size: 0.82rem;
            line-height: 1.45;
        }

        /* Contact Section Details */
        .contact-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 40px;
            border-radius: 24px;
            backdrop-filter: blur(15px);
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }

        .contact-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 25px 0;
        }

        .contact-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            padding: 16px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .contact-item:hover {
            background: rgba(16, 185, 129, 0.08);
            border-color: rgba(16, 185, 129, 0.3);
        }

        .contact-icon {
            width: 42px;
            height: 42px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .contact-text h4 {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .contact-text span {
            font-size: 0.95rem;
            color: #fff;
            font-weight: 700;
        }

        .footer-note {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
            font-size: 0.8rem
