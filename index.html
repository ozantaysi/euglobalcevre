<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EU Global Çevre | Entegre Çevre & Atık Yönetimi Çözümleri</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --accent: #3b82f6;
            --bg-dark: #091313;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* Full-Page Scroll Container */
        .snap-container {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }

        section {
            min-height: 100vh;
            width: 100%;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 90px 8% 40px;
            overflow: hidden;
        }

        /* Fixed Navigation */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(9, 19, 19, 0.95), rgba(9, 19, 19, 0.6));
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: -0.5px;
        }

        .logo i {
            color: var(--primary);
            font-size: 1.8rem;
        }

        nav ul {
            display: flex;
            gap: 30px;
            list-style: none;
            align-items: center;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 0;
        }

        nav a:hover, nav a.active {
            color: var(--primary);
        }

        .header-contact {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-phone {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--primary);
            padding: 8px 18px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .header-phone:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }

        /* Dropdown Menu */
        .dropdown {
            position: relative;
        }

        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: -20px;
            width: 280px;
            background: rgba(15, 23, 23, 0.95);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 12px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: all 0.3s ease;
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .dropdown:hover .dropdown-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .dropdown-menu li a {
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.88rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dropdown-menu li a:hover {
            background: rgba(16, 185, 129, 0.1);
            color: var(--primary);
        }

        .dropdown-menu li a i {
            width: 20px;
            color: var(--primary);
        }

        /* Side Pagination Dots */
        .side-dots {
            position: fixed;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 100;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .dot.active {
            background: var(--primary);
            box-shadow: 0 0 12px var(--primary);
            transform: scale(1.4);
        }

        /* Background Overlays */
        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background-size: cover;
            background-position: center;
            filter: brightness(0.25);
        }

        .hero-bg { background-image: url('https://images.pexels.com/photos/802221/pexels-photo-802221.jpeg?auto=compress&cs=tinysrgb&w=1920'); }
        .about-bg { background-image: url('https://images.pexels.com/photos/957024/forest-trees-perspective-bright-957024.jpeg?auto=compress&cs=tinysrgb&w=1920'); }
        .services-bg { background-image: url('https://images.pexels.com/photos/1549528/pexels-photo-1549528.jpeg?auto=compress&cs=tinysrgb&w=1920'); }
        .contact-bg { background-image: url('https://images.pexels.com/photos/3735218/pexels-photo-3735218.jpeg?auto=compress&cs=tinysrgb&w=1920'); }

        /* Section Contents */
        .content {
            position: relative;
            z-index: 2;
            max-width: 1250px;
            width: 100%;
        }

        /* Hero Content */
        .hero-content {
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--primary);
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 25px;
            backdrop-filter: blur(5px);
        }

        .hero-content h1 {
            font-size: 3.8rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 25px;
            letter-spacing: -1px;
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-content p {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 35px;
            line-height: 1.6;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 16px 36px;
            border-radius: 40px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
        }

        .btn-primary {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.3);
        }

        .btn-primary:hover {
            background: #10b981;
            transform: translateY(-3px);
            box-shadow: 0 0 35px rgba(16, 185, 129, 0.5);
        }

        .btn-outline {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-3px);
        }

        /* Section Titles */
        .section-header {
            margin-bottom: 35px;
            text-align: center;
        }

        .subtitle {
            color: var(--primary);
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: block;
            margin-bottom: 8px;
        }

        .title {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        /* About Grid */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
        }

        .about-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 35px;
            border-radius: 24px;
            backdrop-filter: blur(12px);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 25px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            padding: 20px 15px;
            border-radius: 16px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 2rem;
            color: var(--primary);
            font-weight: 800;
        }

        .stat-card p {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-top: 5px;
            font-weight: 600;
        }

        /* Services Grid (8 Hizmet Kartı) */
        .services-grid-8 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .service-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 25px 20px;
            border-radius: 20px;
            backdrop-filter: blur(12px);
            transition: all 0.35s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .service-card:hover {
            transform: translateY(-6px);
            border-color: rgba(16, 185, 129, 0.4);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }

        .card-num {
            position: absolute;
            bottom: 10px;
            right: 15px;
            font-size: 2.2rem;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.04);
            pointer-events: none;
        }

        .service-icon {
            width: 48px;
            height: 48px;
            background: rgba(16, 185, 129, 0.12);
            color: var(--primary);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            margin-bottom: 18px;
        }

        .service-card h3 {
            font-size: 1.05rem;
            margin-bottom: 10px;
            font-weight: 700;
            color: #fff;
            line-height: 1.3;
        }

        .service-card p {
            color: var(--text-muted);
            font-size: 0.85rem;
            line-height: 1.5;
        }

        /* Contact Section Details */
        .contact-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 50px;
            border-radius: 30px;
            backdrop-filter: blur(15px);
            text-align: center;
            max-width: 850px;
            margin: 0 auto;
        }

        .contact-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 30px 0;
        }

        .contact-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            text-align: left;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .contact-item:hover {
            background: rgba(16, 185, 129, 0.08);
            border-color: rgba(16, 185, 129, 0.3);
            transform: translateY(-3px);
        }

        .contact-icon {
            width: 50px;
            height: 50px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--primary);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            flex-shrink: 0;
        }

        .contact-text h4 {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 3px;
        }

        .contact-text span {
            font-size: 1.05rem;
            color: #fff;
            font-weight: 700;
        }

        .footer-note {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Scroll Down Indicator */
        .scroll-down {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: var(--text-muted);
            font-size: 1.1rem;
            animation: bounce 2s infinite;
            text-decoration: none;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translate(-50%, 0); }
            40% { transform: translate(-50%, -10px); }
            60% { transform: translate(-50%, -5px); }
        }

        /* Responsive */
        @media (max-width: 1100px) {
            .services-grid-8 { grid-template-columns: repeat(2, 1fr); }
            .hero-content h1 { font-size: 3rem; }
        }

        @media (max-width: 768px) {
            section { padding: 80px 5% 30px; }
            .hero-content h1 { font-size: 2.2rem; }
            .grid-2 { grid-template-columns: 1fr; gap: 20px; }
            .services-grid-8 { grid-template-columns: 1fr; }
            .contact-info-grid { grid-template-columns: 1fr; }
            nav { display: none; }
            .side-dots { display: none; }
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

                <li class="dropdown">
                    <a href="#services">
